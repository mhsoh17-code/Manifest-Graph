    <style type="text/css">
        /* فونت محلی فارسی */
        @font-face {
            font-family: 'Vazirmatn';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('./assets/vazirmatn.woff2') format('woff2');
            unicode-range: U+0600-06FF, U+0750-077F, U+0870-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC;
        }

        /* فونت محلی ارقام و انگلیسی */
        @font-face {
            font-family: 'Vazirmatn';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('./assets/vazirmatn-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        :root {
            --bg-dark: #09090b; /* Zinc 950 */
            --glass-bg: rgba(24, 24, 27, 0.88);
            --glass-border: rgba(255, 255, 255, 0.08);
            --edge-color: #60a5fa;
            --graph-tx: 0px;
            --graph-ty: 0px;
            --graph-scale: 1;
        }
        
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            -webkit-touch-callout: none !important;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            overflow: hidden;
            background: var(--bg-dark);
        }
        
        /* Modern Ambient Background Glows */
        .glow-blob { position: fixed; border-radius: 50%; filter: blur(120px); z-index: 0; opacity: 0.45; pointer-events: none; }
        .glow-1 { top: -15%; right: -5%; width: 50vw; height: 50vw; background: rgba(99, 102, 241, 0.15); }
        .glow-2 { bottom: -10%; left: -10%; width: 60vw; height: 60vw; background: rgba(16, 185, 129, 0.1); }
        .glow-3 { top: 30%; left: 20%; width: 40vw; height: 40vw; background: rgba(236, 72, 153, 0.08); }

        #mynetwork {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            z-index: 10;
            outline: none;
            transform-origin: 50% 50%;
            transform: translate3d(var(--graph-tx), var(--graph-ty), 0) scale(var(--graph-scale));
            /* زمان‌بندی و منحنی کاملاً هماهنگ با حرکت پنجره مفاهیم (0.42s) برای شروع و پایان همزمان */
            transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        /* در حالت ترکینگ زنده (هنگام باز/بسته شدن آکاردئون یا کشیدن پنجره با انگشت) ترنزیشن CSS خاموش می‌شود تا بدون یک میلی‌ثانیه تاخیر، فریم‌به‌فریم با پنجره حرکت کند */
        body.graph-live-sync #mynetwork {
            transition: none !important;
        }
        
        /* Ultra Modern Modal Styles */
        #edge-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            padding: 20px;
        }
        #edge-modal.show {
            opacity: 1;
            pointer-events: all;
        }
        
        /* Modal Layout with Side Nodes (Desktop) */
        .modal-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            gap: 0;
            transform: translate3d(0, 20px, 0) scale(0.95);
            transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }
        #edge-modal.show .modal-layout {
            transform: translate3d(0, 0, 0) scale(1);
        }

        .side-node {
            background: rgba(255, 255, 255, 0.04); 
            padding: 16px 28px;
            border-radius: 16px;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .connecting-line {
            height: 2px;
            width: 50px; 
            transition: all 0.3s ease;
            position: relative;
            flex-shrink: 0;
        }

        /* نمایش گرافیکی افقی ضلع در بالای پنجره موبایل (بیرون پنجره، بالای دستگیره) */
        .mobile-edge-graphic {
            display: none;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 360px;
            margin: 0 auto 10px auto;
            padding: 0 14px;
            pointer-events: none;
        }
        .mobile-edge-node {
            background: rgba(24, 24, 27, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 7px 14px;
            border-radius: 12px;
            color: #f8fafc;
            font-size: 12.5px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mobile-edge-line-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 64px;
        }
        .mobile-edge-line {
            width: 100%;
            height: 2px;
            background: var(--edge-color);
            box-shadow: 0 0 10px var(--edge-color);
        }
        .mobile-edge-spindle {
            position: absolute;
            width: 44px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 8px var(--edge-color));
        }
        .mobile-edge-spindle svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .modal-content {
            background: var(--glass-bg); 
            border-radius: 20px;
            padding: 28px 32px;
            flex: 1;
            max-width: 650px;
            max-height: 82vh;
            max-height: 82dvh;
            overflow-y: auto;
            color: #fff;
            position: relative;
            z-index: 2;
        }

        .sheet-handle-area {
            display: none;
            width: 100%;
            padding: 6px 0 12px 0;
            cursor: grab;
            touch-action: none;
        }
        .sheet-handle {
            width: 42px;
            height: 4.5px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            margin: 0 auto;
        }
        
        .modal-header {
            display: none;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        
        /* Accordion Styles */
        .accordion-item {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 8px;
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
        }
        .accordion-item:last-child {
            margin-bottom: 0;
        }
        .accordion-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.09);
        }
        
        .accordion-header {
            padding: 16px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e2e8f0;
        }
        .accordion-header::after {
            content: '＋';
            font-size: 14px;
            color: #64748b;
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .accordion-item.active .accordion-header::after {
            content: '−';
            transform: rotate(180deg);
            color: #f8fafc;
        }
        
        /* استفاده از CSS Grid برای انیمیشن باز و بسته شدن آکاردئون‌ها تا ارتفاع واقعی در هر میلی‌ثانیه بدون تاخیر تغییر کند */
        .accordion-body-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.34s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .accordion-item.active .accordion-body-wrapper {
            grid-template-rows: 1fr;
        }
        .accordion-body {
            min-height: 0;
            overflow: hidden;
            padding: 0 20px;
            transition: padding 0.34s cubic-bezier(0.22, 1, 0.36, 1);
            font-size: 13.5px;
            line-height: 2.2;
            text-align: justify;
            color: #cbd5e1;
            cursor: pointer;
        }
        .accordion-item.active .accordion-body {
            padding: 0 20px 20px 20px;
        }
        
        /* لایه برندینگ پایین صفحه به همراه افکت نوری نقره‌ای شتاب‌دار (سبک Analyzing / Thinking چت‌جی‌پی‌تی) هر ۷ ثانیه یک‌بار */
        .brand-logo { 
            position: fixed;
            bottom: 26px;
            left: 36px; 
            font-size: 13px;
            font-weight: 500; 
            z-index: 500;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-title {
            position: relative;
            display: inline-block;
            background: linear-gradient(
                110deg,
                #71717a 0%,
                #71717a 38%,
                #d4d4d8 46%,
                #ffffff 50%,
                #d4d4d8 54%,
                #71717a 62%,
                #71717a 100%
            );
            background-size: 300% 100%;
            background-position: 140% 50%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }
        .brand-dot {
            color: #3f3f46;
            margin-bottom: 2px;
        }
        .brand-manifest {
            position: relative;
            display: inline-block;
            letter-spacing: 5px;
            font-weight: 300;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 12px;
            background: linear-gradient(
                110deg,
                #52525b 0%,
                #52525b 38%,
                #d4d4d8 46%,
                #ffffff 50%,
                #d4d4d8 54%,
                #52525b 62%,
                #52525b 100%
            );
            background-size: 300% 100%;
            background-position: 140% 50%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }
        .brand-logo.shimmer-active .brand-manifest {
            animation: silverShimmerSweep 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .brand-logo.shimmer-active .brand-title {
            animation: silverShimmerSweep 1.5s cubic-bezier(0.4, 0, 0.2, 1) 0.14s forwards;
        }

        @keyframes silverShimmerSweep {
            0% {
                background-position: 140% 50%;
                filter: drop-shadow(0 0 0px rgba(255, 255, 255, 0));
            }
            45% {
                filter: drop-shadow(0 0 7px rgba(255, 255, 255, 0.35));
            }
            100% {
                background-position: -60% 50%;
                filter: drop-shadow(0 0 0px rgba(255, 255, 255, 0));
            }
        }

        .modal-content::-webkit-scrollbar { width: 4px; }
        .modal-content::-webkit-scrollbar-track { 
            background: transparent; 
            margin-top: 14px;
            margin-bottom: 14px;
        }
        .modal-content::-webkit-scrollbar-thumb { 
            background: rgba(255,255,255,0.12); 
            border-radius: 10px; 
        }
        .modal-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }

        /* Responsive Mobile View: Dynamic Live-Synced Zoom-Out Above Modal */
        @media (max-width: 768px) {
            /* در موبایل: معماری پرداختن در گوشه راست و MANIFEST در گوشه چپ همان لایه */
            .brand-logo {
                bottom: 16px;
                left: 20px;
                right: 20px;
                justify-content: space-between;
                font-size: 11.5px;
            }
            .brand-dot {
                display: none;
            }
            .brand-manifest {
                font-size: 10.5px;
                letter-spacing: 3.5px;
            }

            /* شفاف نگه داشتن بالای صفحه در موبایل برای دید کامل به گراف زوم‌اوت شده */
            #edge-modal {
                padding: 0;
                align-items: flex-end;
                background: linear-gradient(to bottom, rgba(9, 9, 11, 0) 0%, rgba(9, 9, 11, 0.04) 28%, rgba(9, 9, 11, 0.82) 55%);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
            .modal-layout {
                flex-direction: column;
                justify-content: flex-end;
                max-width: 100%;
                transform: translate3d(0, 100%, 0);
                transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
            }
            #edge-modal.show .modal-layout {
                transform: translate3d(0, 0, 0);
            }
            .side-node, .connecting-line {
                display: none;
            }
            .mobile-edge-graphic {
                display: flex;
            }
            .sheet-handle-area {
                display: block;
            }
            .modal-content {
                max-width: 100%;
                width: 100%;
                /* ارتفاع بیشتر برای پنجره در موبایل تا هم بلندتر و خواناتر باشد و هم آیتم‌ها فضای کافی داشته باشند */
                max-height: 72dvh;
                border-radius: 24px 24px 0 0;
                border-bottom: none !important;
                border-left: none !important;
                border-right: none !important;
                /* پدینگ متناسب با افزایش فاصله پایین‌ترین برگه از لبه اسکرین */
                padding: 10px 20px max(34px, env(safe-area-inset-bottom, 24px)) 20px;
                background: rgba(20, 20, 24, 0.95);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                overscroll-behavior-y: contain;
            }
            .modal-content::-webkit-scrollbar-track {
                margin-top: 24px;
                margin-bottom: 24px;
            }
            .accordion-header {
                padding: 14px 16px;
                font-size: 13.5px;
            }
            .accordion-body {
                padding: 0 16px;
                font-size: 13px;
                line-height: 2.1;
            }
            .accordion-item.active .accordion-body {
                padding: 0 16px 16px 16px;
            }
        }
    </style>

    <script type="text/javascript">
        // تنظیم داینامیک URL کامل تصویر تامبنیل برای شبکه‌های اجتماعی
        (function setAbsoluteOgImage() {
            try {
                var fullImgUrl = new URL('./preview.png', window.location.href).href;
                var ogImg = document.querySelector('meta[property="og:image"]');

                if (ogImg) ogImg.setAttribute('content', fullImgUrl);
                if (twImg) twImg.setAttribute('content', fullImgUrl);

        })();

        const essayChunks = [
            { title: "فراخوانی وضعیت", text: "معماری در هر اراده‌ورزی برای فراخوانی یک وضعیت حضور دارد. و نقش معمار از صرفاً ساختن، به «تألیفِ فرایند» گسترش می‌یابد." },
            { title: "تألیفِ فرایند", text: "این تألیف، یک آفرینش آگاهانه است که شباهت بسیاری به کدنویسی دارد، اما از صفر؛ جایی که هیچ زبانِ پیش‌فرض یا سبک آماده‌ای وجود ندارد. معمار با تکیه بر دانشی پویا و تلاش فکری منحصربه‌فرد، دیگر راه‌حل را از انباشت حافظه‌ی خود یا سبک‌های آماده فراخوانی نمی‌کند." },
            { title: "واقعیت پویا", text: "اگر واقعیتی که با آن کار می‌کنیم، پویاست، دیگر دیوارهای محیط مصنوع، عناصری منفعل نیستند. همان‌طور که در استعاره‌ی بازی «پک‌من»، ویژگی‌ها و نسبت‌های دیوارها در تعیین وضعیت جاری مؤثرند، در تولیدِ واقعیت نیز سهم دارند." },
            { title: "معماریِ پرداختن", text: "بر این بستر، معماریِ پرداختن، یک تنظیم موقعیت و زاویه‌ی نگاه، برای جستجو در ریشه‌هاست. وقتی با مسأله به عنوان محصولِ موضوعی مهم‌تر مواجهه کنیم، اطلاعاتی بنیادین دریافت می‌کنیم." },
            { title: "کنش بکر در طبیعت", text: "معماری یک کنش بکر و بنیادین در بدنه‌ی طبیعت است؛ نه یک واکنش. ما می‌پردازیم (متد) تا وضعیت‌های مطلوب را فراخوانی کنیم (هدف)." },

            { title: "پردازش طیفی", text: "از آن‌جا که واقعیت بیرونی پویاست، ابزار درونی ما نیز می‌تواند طیفی و غیرخطی باشد. ذهن معمار در این مرحله یک آزمایشگاه است که منطقِ پردازش در آن، نه صفر و یک، بلکه کار با طیف‌ها (Gradients) است." },

            { title: "سهم از رخداد واقعیت", text: "تلاش ما در این سفر اکتشافی به هسته‌ی معماری، پذیرش مسئولیت در برابر واقعیت تولید شده است. این سهم از رخداد واقعیت مستقیم بر کیفیت بودن انسان اثر می‌گذارد." }
        ];

        // مختصات دوگانه: افقی (Desktop) و عمودی (Mobile)
        // در هر دو نما، گراف ۱۵٪ جمع‌وجورتر و به اندازه ۲۶ پیکسل بالاتر شیفت داده شده تا کاملاً پایدار، بدون تکان و با تعادل بصری بی‌نقص در مرکز دید مستقر شود
        const baseNodes = [
            { id: 6, label: 'طبیعت و بستر', hex: '#fbbf24',
              desktop: { x: 340, y: -154, vadjust: -38 },
              mobile:  { x: 89,  y: -271, vadjust: -42 } },
            { id: 1, label: 'هسته مانیفست', hex: '#60a5fa',
              desktop: { x: 128, y: -26,  vadjust: -38 }, // انتقال عنوان هسته مانیفست به بالای گره در لپ‌تاپ جهت عدم تداخل با مسیر زیرین
              mobile:  { x: 0,   y: -137, vadjust: -42 } },
            { id: 5, label: 'آینده و مسئولیت', hex: '#34d399',
              desktop: { x: 213, y: 161,  vadjust: 4 },
              mobile:  { x: 111, y: -11,  vadjust: -2 } },
            { id: 2, label: 'هندسه معرفتی', hex: '#c084fc',
              desktop: { x: -153, y: -86, vadjust: -38 },
              mobile:  { x: -94,  y: 0,   vadjust: -42 } },
            { id: 4, label: 'آسیب‌شناسی', hex: '#f87171',
              desktop: { x: -255, y: 110, vadjust: 4 },
              mobile:  { x: 77,   y: 150, vadjust: -2 } },
            { id: 3, label: 'رابط کاربری', hex: '#fb923c',
              desktop: { x: -425, y: -1,  vadjust: -38 },
              mobile:  { x: -102, y: 204, vadjust: -2 } }
        ];

        const edgesData = [
            {id: 'e6', from: 6, to: 1, titlePath: 'تأثیر بستر بر هسته', chunks: [essayChunks[2], essayChunks[4], essayChunks[5]], rawColor: '#fbbf24'},
            {id: 'e1', from: 1, to: 2, titlePath: 'انتقال اراده به ذهن', chunks: [essayChunks[0], essayChunks[1], essayChunks[3]], rawColor: '#60a5fa'},
            {id: 'e2', from: 2, to: 3, titlePath: 'تبلور ذهنی در فرم', chunks: [essayChunks[6], essayChunks[7], essayChunks[8]], rawColor: '#c084fc'},
            {id: 'e3', from: 3, to: 4, titlePath: 'آسیب‌های فرم ناکارآمد', chunks: [essayChunks[10], essayChunks[11], essayChunks[12]], rawColor: '#fb923c'},
            {id: 'e4', from: 4, to: 2, titlePath: 'بازخورد آسیب‌ها بر ذهن', chunks: [essayChunks[9], essayChunks[14]], rawColor: '#f87171'},
            {id: 'e5', from: 1, to: 5, titlePath: 'جهش از هسته به آینده', chunks: [essayChunks[13], essayChunks[15]], rawColor: '#34d399'}
        ];

        // ترتیب زمانی وزش موج تنفس: از گوشه بالا راست به سمت گوشه پایین چپ
        // ۱. زرد (e6) -> ۲. سبز (e5) -> ۳. آبی (e1) -> ۴. قرمز (e4) -> ۵. بنفش (e2) -> ۶. نارنجی (e3)
        const breathOrderIndex = {
            'e6': 0, // زرد (#fbbf24) - گوشه بالا راست
            'e5': 1, // سبز (#34d399) - متمایل به راست
            'e1': 2, // آبی (#60a5fa) - میانی
            'e4': 3, // قرمز (#f87171) - متمایل به چپ
            'e2': 4, // بنفش (#c084fc) - چپ
            'e3': 5  // نارنجی (#fb923c) - گوشه پایین چپ
        };

        var isMiniatureMode = false;
        var activeEdgeId = null;
        var pulseAnimFrame = null;

        // مدیریت سیکل هوشمند و متناوب افکت دعوت به لمس و هماهنگی با درخشش برند/مانیفست
        var affordanceStartTime = null;
        var affordanceCurrentDuration = 1250;
        var affordanceAnimFrame = null;
        var affordanceIdleTimer = null;
        var brandShimmerTimer = null;

        function triggerBrandShimmer() {
            var brandEl = document.querySelector('.brand-logo');
            if (!brandEl) return;
            brandEl.classList.remove('shimmer-active');
            void brandEl.offsetWidth; // Force Reflow
            brandEl.classList.add('shimmer-active');
            setTimeout(function() {
                if (brandEl) brandEl.classList.remove('shimmer-active');
            }, 1900);
        }

        function mixHexWithWhite(hex, ratio) {
            var c = hex.replace('#', '');
            var r = parseInt(c.substring(0, 2), 16);
            var g = parseInt(c.substring(2, 4), 16);
            var b = parseInt(c.substring(4, 6), 16);
            r = Math.round(r + (255 - r) * ratio);
            g = Math.round(g + (255 - g) * ratio);
            b = Math.round(b + (255 - b) * ratio);
            return 'rgb(' + r + ',' + g + ',' + b + ')';
        }

        function hexToRgb(hex) {
            var c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(function(x){ return x + x; }).join('');
            return {
                r: parseInt(c.substring(0, 2), 16) || 0,
                g: parseInt(c.substring(2, 4), 16) || 0,
                b: parseInt(c.substring(4, 6), 16) || 0
            };
        }

        function hexToRgba(hex, alpha) {
            var rgb = hexToRgb(hex);
            return 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + alpha.toFixed(3) + ')';
        }

        function stopAffordanceCycle() {
            if (affordanceIdleTimer) {
                clearTimeout(affordanceIdleTimer);
                affordanceIdleTimer = null;
            }
            if (affordanceAnimFrame) {
                cancelAnimationFrame(affordanceAnimFrame);
                affordanceAnimFrame = null;
            }
            if (brandShimmerTimer) {
                clearTimeout(brandShimmerTimer);
                brandShimmerTimer = null;
            }
            var brandEl = document.querySelector('.brand-logo');
            if (brandEl) brandEl.classList.remove('shimmer-active');
            affordanceStartTime = null;
        }

        function scheduleNextAffordanceWave(delayMs, waveDurationMs) {
            if (affordanceIdleTimer) {
                clearTimeout(affordanceIdleTimer);
                affordanceIdleTimer = null;
            }
            affordanceIdleTimer = setTimeout(function() {
                affordanceIdleTimer = null;
                if (isMiniatureMode || activeEdgeId || document.getElementById('edge-modal').classList.contains('show')) {
                    return;
                }
                runAffordanceWave(waveDurationMs);
            }, delayMs);
        }

        function runAffordanceWave(durationMs) {
            if (affordanceIdleTimer) {
                clearTimeout(affordanceIdleTimer);
                affordanceIdleTimer = null;
            }
            if (affordanceAnimFrame) {
                cancelAnimationFrame(affordanceAnimFrame);
                affordanceAnimFrame = null;
            }
            if (isMiniatureMode || activeEdgeId || document.getElementById('edge-modal').classList.contains('show')) {
                return;
            }
            affordanceCurrentDuration = durationMs || 1250;
            affordanceStartTime = performance.now();

            function stepAffordance(now) {
                if (isMiniatureMode || activeEdgeId || document.getElementById('edge-modal').classList.contains('show')) {
                    stopAffordanceCycle();
                    return;
                }
                var elapsed = now - affordanceStartTime;
                if (elapsed < affordanceCurrentDuration) {
                    if (network) network.redraw();
                    affordanceAnimFrame = requestAnimationFrame(stepAffordance);
                } else {
                    affordanceStartTime = null;
                    affordanceAnimFrame = null;
                    if (network) network.redraw();

                    // دقیقاً ۰.۵ ثانیه پس از پایان تنفس گره‌ها، افکت درخشش عنوان و مانیفست اجرا می‌شود
                    if (brandShimmerTimer) clearTimeout(brandShimmerTimer);
                    brandShimmerTimer = setTimeout(function() {
                        brandShimmerTimer = null;
                        if (!isMiniatureMode && !activeEdgeId && !document.getElementById('edge-modal').classList.contains('show')) {
                            triggerBrandShimmer();
                        }
                    }, 500);

                    // پس از پایان موج تنفس، مکث ۵.۷۵ ثانیه‌ای سکون و سپس تکرار موج پله‌ای (سایکل دقیق ۷ ثانیه‌ای)
                    scheduleNextAffordanceWave(5750, 1250);
                }
            }
            affordanceAnimFrame = requestAnimationFrame(stepAffordance);
        }

        function startPulseLoop() {
            if (pulseAnimFrame) cancelAnimationFrame(pulseAnimFrame);
            function step() {
                if (!activeEdgeId) {
                    pulseAnimFrame = null;
                    return;
                }
                if (network) network.redraw();
                pulseAnimFrame = requestAnimationFrame(step);
            }
            pulseAnimFrame = requestAnimationFrame(step);
        }

        function stopPulseLoop() {
            activeEdgeId = null;
            if (pulseAnimFrame) {
                cancelAnimationFrame(pulseAnimFrame);
                pulseAnimFrame = null;
            }
            if (network) network.redraw();
        }

        function isPortraitMode() {
            return window.innerHeight > window.innerWidth || window.innerWidth <= 768;
        }

        function getNodesForViewport() {
            const portrait = isPortraitMode();
            return baseNodes.map(node => {
                const pos = portrait ? node.mobile : node.desktop;
                return {
                    id: node.id,
                    label: node.label,
                    fullLabel: node.label,
                    hexColor: node.hex,
                    x: pos.x,
                    y: pos.y,
                    font: { vadjust: pos.vadjust },
                    color: {
                        background: 'rgba(0,0,0,0)',
                        border: 'rgba(0,0,0,0)',
                        hover: { background: 'rgba(0,0,0,0)', border: 'rgba(0,0,0,0)' },
                        highlight: { background: 'rgba(0,0,0,0)', border: 'rgba(0,0,0,0)' }
                    }
                };
            });
        }

        edgesData.forEach(edge => {
            edge.color = { color: 'rgba(0,0,0,0)', highlight: 'rgba(0,0,0,0)', hover: 'rgba(0,0,0,0)', inherit: false, opacity: 0 };
        });

        // در چیدمان عمودی (موبایل)، دو سر مسیر بنفش تقریباً در یک راستای عمودی قرار می‌گیرند و منحنی معمولی صاف دیده می‌شود؛
        // بنابراین در حالت پرتره یک انحنای کمانی ملایم و هماهنگ به سمت مرکز گراف برای آن تنظیم می‌شود
        var DEFAULT_EDGE_SMOOTH = { enabled: true, type: 'cubicBezier', roundness: 0.5 };
        var PORTRAIT_EDGE_SMOOTH_OVERRIDES = {
            'e2': { enabled: true, type: 'curvedCW', roundness: 0.26 }
        };

        function getEdgeSmoothForViewport(edgeId) {
            if (isPortraitMode() && PORTRAIT_EDGE_SMOOTH_OVERRIDES[edgeId]) {
                return PORTRAIT_EDGE_SMOOTH_OVERRIDES[edgeId];
            }
            return DEFAULT_EDGE_SMOOTH;
        }

        edgesData.forEach(edge => {
            edge.smooth = getEdgeSmoothForViewport(edge.id);
        });

        function applyEdgeSmoothingForViewport() {
            if (typeof edgesDataSet === 'undefined' || !edgesDataSet) return;
            edgesDataSet.update(edgesData.map(function(edge) {
                return { id: edge.id, smooth: getEdgeSmoothForViewport(edge.id) };
            }));
        }

        var network = null;
        var nodesDataSet = new vis.DataSet(getNodesForViewport());
        var edgesDataSet = new vis.DataSet(edgesData);
        
        var hoveredEdgeId = null;
        var edgeHoverGlow = {}; // سطح روشنایی نرم و تدریجی هاور برای هر مسیر (0.0 تا 1.0)
        var edgeHoverScale = {}; // سطح انبساط مقیاس پوسته و مرواریدهای میان‌مسیر بر اثر هاور (0.0 تا 1.0)
        var hoverRafId = null;
        var lastHoverFrameTime = performance.now();
        var pearlFlashStates = {}; // انیمیشن درخشش رعدآسای مرواریدهای میان‌مسیرهای متصل
        var lastModalOpenTime = 0;

        function startHoverLoop() {
            if (hoverRafId) return;
            lastHoverFrameTime = performance.now();
            function stepHover(now) {
                var dt = Math.min(60, now - lastHoverFrameTime);
                lastHoverFrameTime = now;
                var hasActive = false;

                edgesData.forEach(function(e) {
                    var isTarget = (hoveredEdgeId === e.id);
                    var currentGlow = edgeHoverGlow[e.id] || 0;
                    var currentScale = edgeHoverScale[e.id] || 0;

                    // ۱. روشنایی مسیر: ورود سریع، خاموش شدن چابک‌تر و سریع‌تر (۱۹۰ میلی‌ثانیه به جای ۳۰۰)
                    if (isTarget) {
                        if (currentGlow < 1.0) {
                            edgeHoverGlow[e.id] = 1.0;
                            hasActive = true;
                        }
                    } else if (currentGlow > 0.005) {
                        edgeHoverGlow[e.id] = Math.max(0, currentGlow - (dt / 190));
                        hasActive = true;
                    } else {
                        edgeHoverGlow[e.id] = 0;
                    }

                    // ۲. مقیاس پوسته و مرواریدهای میان‌مسیر: ورود سریع، کوچک شدن آرام، ابریشمی و زنده (۲۸۰ میلی‌ثانیه)
                    if (isTarget) {
                        if (currentScale < 1.0) {
                            edgeHoverScale[e.id] = Math.min(1.0, currentScale + (dt / 85));
                            hasActive = true;
                        }
                    } else if (currentScale > 0.005) {
                        edgeHoverScale[e.id] = Math.max(0, currentScale - (dt / 280));
                        hasActive = true;
                    } else {
                        edgeHoverScale[e.id] = 0;
                    }
                });

                if (network) network.redraw();

                if (hasActive) {
                    hoverRafId = requestAnimationFrame(stepHover);
                } else {
                    hoverRafId = null;
                    if (network) network.redraw();
                }
            }
            hoverRafId = requestAnimationFrame(stepHover);
        }

        // محاسبه دقیق کادر دربرگیرنده (Bounding Box) گراف فعلی روی صفحه برای جایگذاری بی‌نقص در فضای خالی بالای پنجره
        var graphBaseBBox = null;

        function measureGraphBaseBBox() {
            if (!network) return null;
            var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            baseNodes.forEach(function(n) {
                var domPt = network.canvasToDOM({ x: n.mobile.x, y: n.mobile.y });
                if (domPt.x < minX) minX = domPt.x;
                if (domPt.x > maxX) maxX = domPt.x;
                if (domPt.y < minY) minY = domPt.y;
                if (domPt.y > maxY) maxY = domPt.y;
            });
            var pad = 22;
            minX -= pad; maxX += pad;
            minY -= pad; maxY += pad;
            return {
                minX: minX, maxX: maxX,
                minY: minY, maxY: maxY,
                width: Math.max(1, maxX - minX),
                height: Math.max(1, maxY - minY),
                centerX: (minX + maxX) * 0.5,
                centerY: (minY + maxY) * 0.5
            };
        }

        // تنظیم هوشمند و لحظه‌ای موقعیت و زوم گراف متناسب با فضای خالی بالای پنجره در موبایل
        function syncGraphToAvailableSpace(extraBottomOffset) {
            if (!isMiniatureMode || window.innerWidth > 768) return;
            var vh = window.innerHeight;
            var vw = window.innerWidth;

            if (!graphBaseBBox) {
                graphBaseBBox = measureGraphBaseBBox();
            }
            if (!graphBaseBBox) return;

            var modalBox = document.getElementById('modal-content-box');
            var mobileGraphic = document.getElementById('mobile-edge-graphic');

            var modalH = modalBox ? modalBox.offsetHeight : (vh * 0.5);
            var graphicH = (mobileGraphic && mobileGraphic.offsetHeight) ? (mobileGraphic.offsetHeight + 10) : 44;

            var swipeOffset = extraBottomOffset || 0;
            var occupiedBottom = Math.max(0, modalH + graphicH - swipeOffset);

            var topSafeMargin = 14;
            var bottomSafeGap = 12;
            var availH = Math.max(54, vh - occupiedBottom - topSafeMargin - bottomSafeGap);
            var availW = vw * 0.88;

            var scaleH = availH / graphBaseBBox.height;
            var scaleW = availW / graphBaseBBox.width;
            // اعمال ضریب ۰.۹ (۱۰ درصد کوچکتر) برای حفظ حاشیه امن و تنفس بصری بهتر در وضعیت‌های مختلف زوم
            var targetScale = Math.min(scaleH, scaleW, 0.58) * 0.90;
            targetScale = Math.max(0.13, targetScale);

            var targetCenterY = topSafeMargin + (availH * 0.5);
            var targetCenterX = vw * 0.5;

            var vcx = vw * 0.5;
            var vcy = vh * 0.5;

            var tx = targetCenterX - vcx - (graphBaseBBox.centerX - vcx) * targetScale;
            var ty = targetCenterY - vcy - (graphBaseBBox.centerY - vcy) * targetScale;

            document.documentElement.style.setProperty('--graph-tx', tx.toFixed(2) + 'px');
            document.documentElement.style.setProperty('--graph-ty', ty.toFixed(2) + 'px');
            document.documentElement.style.setProperty('--graph-scale', targetScale.toFixed(4));
        }

        // حلقه سبک و یکپارچه همگام‌سازی زنده گراف با حرکت آکاردئون‌ها (تضمین صفر میلی‌ثانیه تاخیر)
        var liveSyncRafId = null;
        var liveSyncEndTime = 0;

        function triggerLiveGraphSync(durationMs) {
            if (!isMiniatureMode || window.innerWidth > 768) return;
            document.body.classList.add('graph-live-sync');
            var now = performance.now();
            liveSyncEndTime = Math.max(liveSyncEndTime, now + durationMs);

            if (liveSyncRafId) return;

            function stepSync(ts) {
                if (!isMiniatureMode) {
                    document.body.classList.remove('graph-live-sync');
                    liveSyncRafId = null;
                    return;
                }
                syncGraphToAvailableSpace(0);
                if (ts < liveSyncEndTime) {
                    liveSyncRafId = requestAnimationFrame(stepSync);
                } else {
                    liveSyncRafId = null;
                    document.body.classList.remove('graph-live-sync');
                }
            }
            liveSyncRafId = requestAnimationFrame(stepSync);
        }

        function triggerOpenModal(edgeData) {
            if (!edgeData) return;
            var now = Date.now();
            if (now - lastModalOpenTime < 250) return;
            lastModalOpenTime = now;
            openModal(edgeData);
            if (network) {
                network.unselectAll();
            }
        }

        // بررسی قرارگیری نقطه در شعاع غیرقابل کلیک پیرامون هر یک از گره‌های گراف (برای تمرکز کاربر بر مطالعه روابط و مسیرها)
        var NODE_DEAD_ZONE_RADIUS = 50;

        function getNodeInDeadZone(domX, domY) {
            if (!network || !network.body || !network.body.nodes) return null;
            for (var i = 0; i < baseNodes.length; i++) {
                var nId = baseNodes[i].id;
                var visNode = network.body.nodes[nId];
                if (visNode && typeof visNode.x === 'number' && typeof visNode.y === 'number') {
                    var nodeDOM = network.canvasToDOM({ x: visNode.x, y: visNode.y });
                    var dist = Math.hypot(domX - nodeDOM.x, domY - nodeDOM.y);
                    if (dist <= NODE_DEAD_ZONE_RADIUS) {
                        return nId;
                    }
                }
            }
            return null;
        }

        function isPointInNodeDeadZone(domX, domY) {
            return getNodeInDeadZone(domX, domY) !== null;
        }

        // سیستم تعاملی حیات گراف: سر خوردن گره روی رئوس مثلث و انتشار موج به سمت میان‌مسیر
        var edgeWiggleStates = {};
        var wiggleAnimFrame = null;

        // مختصات مرجع گره در ویوپورت فعلی
        function getNodeHomePos(nodeId) {
            var portrait = isPortraitMode();
            var node = baseNodes.find(function(n) { return n.id === nodeId; });
            if (!node) return { x: 0, y: 0 };
            var pos = portrait ? node.mobile : node.desktop;
            return { x: pos.x, y: pos.y };
        }

        function getNodeConnectedEdgeCount(nodeId) {
            return edgesData.filter(function(e) {
                return e.from === nodeId || e.to === nodeId;
            }).length;
        }

        // شعاع جابجایی پایه روی ستاره پنج‌پر (حدود ۵.۸ پیکسل)
        var NODE_DODGE_RADIUS = 5.8;
        var nodeVertexIndices = {};
        var nodeDodgeStates = {};

        function getNodeStarVertex(nodeId, k) {
            var home = getNodeHomePos(nodeId);
            var baseAngle = -Math.PI / 2 + (nodeId * 0.72); // زاویه متوازن و جهت‌گیری ستاره اختصاصی برای هر گره
            var angle = baseAngle + (k * (2 * Math.PI / 5));

            // میزان حرکت همه گره‌ها (اندازه ستاره‌ها) همگی روی ۰.۶ برابر تنظیم شد
            var scaleX = 0.6;
            var scaleY = 0.6;

            return {
                x: home.x + (NODE_DODGE_RADIUS * scaleX * Math.cos(angle)),
                y: home.y + (NODE_DODGE_RADIUS * scaleY * Math.sin(angle))
            };
        }

        function triggerNodeDodge(nodeId) {
            var visNode = network && network.body && network.body.nodes && network.body.nodes[nodeId];
            if (!visNode) return;

            // انتخاب تصادفی یک راس دیگر از ۵ راس ستاره (غیر از راس قبلی) برای غیرقابل پیش‌بینی بودن فرار و حس زنده بودن گراف
            var currentIdx = (nodeVertexIndices[nodeId] !== undefined) ? nodeVertexIndices[nodeId] : -1;
            var available = [0, 1, 2, 3, 4].filter(function(idx) { return idx !== currentIdx; });
            var nextVertexIdx = available[Math.floor(Math.random() * available.length)];
            nodeVertexIndices[nodeId] = nextVertexIdx;

            var targetPos = getNodeStarVertex(nodeId, nextVertexIdx);
            var fromX = (typeof visNode.x === 'number') ? visNode.x : targetPos.x;
            var fromY = (typeof visNode.y === 'number') ? visNode.y : targetPos.y;

            var edgeCount = getNodeConnectedEdgeCount(nodeId);
            var duration = 320;
            var easeType = 'normal';

            if (edgeCount === 1) {
                // گره‌های سبک: پرتاب‌شونده با شتاب اولیه و جهش فنری سبک مثل دست و پا
                duration = 270;
                easeType = 'projectile';
            } else if (edgeCount === 2) {
                duration = 320;
                easeType = 'normal';
            } else {
                // گره‌های سنگین مرکزی: وزین، آرام و جدی با اینرسی بالا مثل اعضای مرکزی بدن
                duration = 400;
                easeType = 'heavy';
            }

            nodeDodgeStates[nodeId] = {
                fromX: fromX,
                fromY: fromY,
                targetX: targetPos.x,
                targetY: targetPos.y,
                startTime: performance.now(),
                duration: duration,
                easeType: easeType
            };
        }

        function easeProjectile(x) {
            var c1 = 1.15;
            var c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        }

        function easeHeavy(x) {
            return 1 - Math.pow(1 - x, 4);
        }

        function easeOutCubic(x) {
            return 1 - Math.pow(1 - x, 3);
        }

        var heldPearlEdgeIds = {};
        var heldNodeId = null;

        function releaseHeldPearls() {
            var hadHeld = (heldNodeId !== null || Object.keys(heldPearlEdgeIds).length > 0);
            if (hadHeld) {
                heldNodeId = null;
                heldPearlEdgeIds = {};
                if (network) network.redraw();
            }
        }

        // واکنش رعدآسای نوری روی مرواریدهای میان‌مسیرهای متصل (برای کلیک راست یا چشمک‌های موقت)
        function triggerPearlLightningFlash(nodeId) {
            var connectedEdges = edgesData.filter(function(e) {
                return e.from === nodeId || e.to === nodeId;
            });
            var now = performance.now();
            connectedEdges.forEach(function(e) {
                pearlFlashStates[e.id] = {
                    startTime: now,
                    duration: 221 // زمان چشمک مرواریدهای همسایه ۱۵٪ کمتر شد (از ۲۶۰ به ۲۲۱ میلی‌ثانیه)
                };
            });
        }

        // واکنش کامل و آنی به لمس یا فشردن گره (سر خوردن گره + ارتعاش طناب + هدایت الکتریکی مرواریدها)
        function triggerNodeTouchResponse(nodeId, isRightClick) {
            if (!nodeId) return;
            triggerNodeDodge(nodeId);
            triggerNodeNeighborsWiggle(nodeId);

            if (isRightClick) {
                // در کلیک راست: چشمک زدن سریع مرواریدهای همسایه با سرعت کنونی (۲۲۱ میلی‌ثانیه) و خاموش شدن خودکار
                releaseHeldPearls();
                triggerPearlLightningFlash(nodeId);
            } else {
                // در کلیک چپ و تپ لمسی موبایل: برقراری مدار الکتریکی و روشن ماندن مرواریدها تا زمان اتصال دست یا کلیک
                heldNodeId = nodeId;
                heldPearlEdgeIds = {};
                var connectedEdges = edgesData.filter(function(e) {
                    return e.from === nodeId || e.to === nodeId;
                });
                connectedEdges.forEach(function(e) {
                    heldPearlEdgeIds[e.id] = true;
                    delete pearlFlashStates[e.id];
                });
                if (network) network.redraw();
            }

            if (!wiggleAnimFrame) {
                startWiggleLoop();
            }
        }

        function triggerNodeNeighborsWiggle(nodeId) {
            if (!nodeId) return;
            var connectedEdges = edgesData.filter(function(e) {
                return e.from === nodeId || e.to === nodeId;
            });
            if (connectedEdges.length === 0) return;

            var now = performance.now();
            connectedEdges.forEach(function(e, idx) {
                var isFrom = (e.from === nodeId);
                var delay = idx * 8; // تاخیر ناچیز و طبیعی
                var duration = 440;   // زمان انتشار موج لاستیکی سفت با میراسازی سریع و بدون تابیدگی
                var maxAmp = 3.0 + Math.random() * 0.8; // کاهش ۴۰ درصدی دیگر تکانه و مهار کامل شلی طناب
                var sign = (Math.random() < 0.5 ? 1 : -1);

                edgeWiggleStates[e.id] = {
                    startTime: now,
                    delay: delay,
                    duration: duration,
                    maxAmp: maxAmp,
                    sign: sign,
                    anchorFrom: isFrom
                };
            });
        }

        function startWiggleLoop() {
            if (wiggleAnimFrame) cancelAnimationFrame(wiggleAnimFrame);
            function stepWiggle(now) {
                var hasActive = false;

                // به‌روزرسانی سر خوردن گره‌ها روی رئوس ستاره
                for (var nId in nodeDodgeStates) {
                    var dState = nodeDodgeStates[nId];
                    if (dState) {
                        var vNode = network && network.body && network.body.nodes && network.body.nodes[nId];
                        if (vNode) {
                            var elapsedD = now - dState.startTime;
                            if (elapsedD < dState.duration) {
                                var pr = elapsedD / dState.duration;
                                var ease = (dState.easeType === 'projectile')
                                    ? easeProjectile(pr)
                                    : ((dState.easeType === 'heavy') ? easeHeavy(pr) : easeOutCubic(pr));
                                vNode.x = dState.fromX + (dState.targetX - dState.fromX) * ease;
                                vNode.y = dState.fromY + (dState.targetY - dState.fromY) * ease;
                                hasActive = true;
                            } else {
                                vNode.x = dState.targetX;
                                vNode.y = dState.targetY;
                                delete nodeDodgeStates[nId];
                            }
                        }
                    }
                }

                // به‌روزرسانی درخشش رعدآسای مرواریدها

                    var pf = pearlFlashStates[pEdgeId];
                    if (pf) {
                        if (now - pf.startTime < pf.duration) {
                            hasActive = true;
                        } else {

                        }
                    }

                // به‌روزرسانی نوسان موجی مسیرهای متصل

                    if (state) {
                        var elapsed = now - state.startTime - (state.delay || 0);
                        if (elapsed < state.duration) {
                            hasActive = true;
                        } else {

                        }
                    }
                }

                if (network) network.redraw();

                if (hasActive) {
                    wiggleAnimFrame = requestAnimationFrame(stepWiggle);
                } else {
                    wiggleAnimFrame = null;
                    if (network) network.redraw();
                }
            }
            wiggleAnimFrame = requestAnimationFrame(stepWiggle);
        }

        function getEdgeWiggleOffset(edgeId, t, now) {
            var state = edgeWiggleStates[edgeId];
            if (!state) return { dx: 0, dy: 0 };
            var elapsed = now - state.startTime - (state.delay || 0);
            if (elapsed <= 0 || elapsed >= state.duration) return { dx: 0, dy: 0 };

            // s: فاصله نرمال‌شده از گره کلیک‌شده به سمت گره دورتر (0 در گره کلیک‌شده، 0.5 در غلاف میان‌مسیر، 1.0 در گره انتهایی)
            var s = state.anchorFrom ? t : (1.0 - t);
            if (s <= 0 || s >= 1.0) return { dx: 0, dy: 0 };

            // فیزیک انتشار موج در طناب با کشسانی لاستیکی سفت (تمرکز تکانه در ابتدای مسیر و میرایی سریع پیش از میانه):
            var T_travel = 320; // زمان سیر موج در طول مسیر با کشش بالا (میلی‌ثانیه)
            var T_pulse = 135;  // پهنای زمانی فشرده و تیز پالس نوسان (میلی‌ثانیه)

            var t_arrive = s * T_travel;
            var tau = elapsed - t_arrive;

            // اگر موج هنوز نرسیده یا کاملاً عبور کرده است، جابجایی دقیقاً صفر است (سکون قطعی و بدون لرزش)
            if (tau <= 0 || tau >= T_pulse) return { dx: 0, dy: 0 };

            var p = tau / T_pulse; // پیشرفت موضعی پالس از ۰ تا ۱
            // شکل موج تکان طناب: یک قوس اوج و سپس یک بازگشت نرم به صفر
            var waveShape = Math.sin(p * 2 * Math.PI) * Math.sin(p * Math.PI);

            // میرایی شدید و تصاعدی در طول مسیر: تکانه فقط در مجاورت گره کلیک‌شده حس می‌شود و در ادامه سریعاً مهار شده تا از تابیدگی منحنی جلوگیری شود
            var damp = Math.exp(-s * 5.2) * Math.pow(Math.max(0, 1.0 - s), 2.2);
            var ramp = Math.min(1.0, s / 0.03);

            var displacement = state.maxAmp * waveShape * damp * ramp * state.sign;

            var visEdge = network && network.body && network.body.edges && network.body.edges[edgeId];
            if (!visEdge || !visEdge.from || !visEdge.to) return { dx: 0, dy: 0 };

            var dy = visEdge.to.y - visEdge.from.y;
