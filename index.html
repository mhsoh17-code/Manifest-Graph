    <style type="text/css">
        /* فونت محلی فارسی */
        @font-face {
            font-family: 'Vazirmatn';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('./assets/vazirmatn.woff2') format('woff2');
            unicode-range: U+0600-06FF, U+0750-077F, U+0870-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC;
        }

        /* فونت محلی ارقام و انگلیسی */
        @font-face {
            font-family: 'Vazirmatn';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url('./assets/vazirmatn-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        :root {
            --bg-dark: #09090b; /* Zinc 950 */
            --glass-bg: rgba(24, 24, 27, 0.88);
            --glass-border: rgba(255, 255, 255, 0.08);
            --edge-color: #60a5fa;
            --graph-tx: 0px;
            --graph-ty: 0px;
            --graph-scale: 1;
        }
        
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            -webkit-touch-callout: none !important;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            overflow: hidden;
            background: var(--bg-dark);
        }
        
        /* Modern Ambient Background Glows */
        .glow-blob { position: fixed; border-radius: 50%; filter: blur(120px); z-index: 0; opacity: 0.45; pointer-events: none; }
        .glow-1 { top: -15%; right: -5%; width: 50vw; height: 50vw; background: rgba(99, 102, 241, 0.15); }
        .glow-2 { bottom: -10%; left: -10%; width: 60vw; height: 60vw; background: rgba(16, 185, 129, 0.1); }
        .glow-3 { top: 30%; left: 20%; width: 40vw; height: 40vw; background: rgba(236, 72, 153, 0.08); }

        #mynetwork {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            z-index: 10;
            outline: none;
            transform-origin: 50% 50%;
            transform: translate3d(var(--graph-tx), var(--graph-ty), 0) scale(var(--graph-scale));
            /* زمان‌بندی و منحنی کاملاً هماهنگ با حرکت پنجره مفاهیم (0.42s) برای شروع و پایان همزمان */
            transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        /* در حالت ترکینگ زنده (هنگام باز/بسته شدن آکاردئون یا کشیدن پنجره با انگشت) ترنزیشن CSS خاموش می‌شود تا بدون یک میلی‌ثانیه تاخیر، فریم‌به‌فریم با پنجره حرکت کند */
        body.graph-live-sync #mynetwork {
            transition: none !important;
        }
        
        /* Ultra Modern Modal Styles */
        #edge-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            padding: 20px;
        }
        #edge-modal.show {
            opacity: 1;
            pointer-events: all;
        }
        
        /* Modal Layout with Side Nodes (Desktop) */
        .modal-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            gap: 0;
            transform: translate3d(0, 20px, 0) scale(0.95);
            transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }
        #edge-modal.show .modal-layout {
            transform: translate3d(0, 0, 0) scale(1);
        }

        .side-node {
            background: rgba(255, 255, 255, 0.04); 
            padding: 16px 28px;
            border-radius: 16px;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .connecting-line {
            height: 2px;
            width: 50px; 
            transition: all 0.3s ease;
            position: relative;
            flex-shrink: 0;
        }

        /* نمایش گرافیکی افقی ضلع در بالای پنجره موبایل (بیرون پنجره، بالای دستگیره) */
        .mobile-edge-graphic {
            display: none;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 360px;
            margin: 0 auto 10px auto;
            padding: 0 14px;
            pointer-events: none;
        }
        .mobile-edge-node {
            background: rgba(24, 24, 27, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 7px 14px;
            border-radius: 12px;
            color: #f8fafc;
            font-size: 12.5px;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mobile-edge-line-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 64px;
        }
        .mobile-edge-line {
            width: 100%;
            height: 2px;
            background: var(--edge-color);
            box-shadow: 0 0 10px var(--edge-color);
        }
        .mobile-edge-spindle {
            position: absolute;
            width: 44px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 8px var(--edge-color));
        }
        .mobile-edge-spindle svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .modal-content {
            background: var(--glass-bg); 
            border-radius: 20px;
            padding: 28px 32px;
            flex: 1;
            max-width: 650px;
            max-height: 82vh;
            max-height: 82dvh;
            overflow-y: auto;
            color: #fff;
            position: relative;
            z-index: 2;
        }

        .sheet-handle-area {
            display: none;
            width: 100%;
            padding: 6px 0 12px 0;
            cursor: grab;
            touch-action: none;
        }
        .sheet-handle {
            width: 42px;
            height: 4.5px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            margin: 0 auto;
        }
        
        .modal-header {
            display: none;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        
        /* Accordion Styles */
        .accordion-item {
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            margin-bottom: 8px;
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
        }
        .accordion-item:last-child {
            margin-bottom: 0;
        }
        .accordion-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.09);
        }
        
        .accordion-header {
            padding: 16px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e2e8f0;
        }
        .accordion-header::after {
            content: '＋';
            font-size: 14px;
            color: #64748b;
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .accordion-item.active .accordion-header::after {
            content: '−';
            transform: rotate(180deg);
            color: #f8fafc;
        }
        
        /* استفاده از CSS Grid برای انیمیشن باز و بسته شدن آکاردئون‌ها تا ارتفاع واقعی در هر میلی‌ثانیه بدون تاخیر تغییر کند */
        .accordion-body-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.34s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .accordion-item.active .accordion-body-wrapper {
            grid-template-rows: 1fr;
        }
        .accordion-body {
            min-height: 0;
            overflow: hidden;
            padding: 0 20px;
            transition: padding 0.34s cubic-bezier(0.22, 1, 0.36, 1);
            font-size: 13.5px;
            line-height: 2.2;
            text-align: justify;
            color: #cbd5e1;
            cursor: pointer;
        }
        .accordion-item.active .accordion-body {
            padding: 0 20px 20px 20px;
        }
        
        /* لایه برندینگ پایین صفحه به همراه افکت نوری نقره‌ای شتاب‌دار (سبک Analyzing / Thinking چت‌جی‌پی‌تی) هر ۷ ثانیه یک‌بار */
        .brand-logo { 
            position: fixed;
            bottom: 26px;
            left: 36px; 
            font-size: 13px;
            font-weight: 500; 
            z-index: 500;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-title {
            position: relative;
            display: inline-block;
            background: linear-gradient(
                110deg,
                #71717a 0%,
                #71717a 38%,
                #d4d4d8 46%,
                #ffffff 50%,
                #d4d4d8 54%,
                #71717a 62%,
                #71717a 100%
            );
            background-size: 300% 100%;
            background-position: 140% 50%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            animation: silverShimmerSweep 9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .brand-dot {
            color: #3f3f46;
            margin-bottom: 2px;
        }
        .brand-manifest {
            position: relative;
            display: inline-block;
            letter-spacing: 5px;
            font-weight: 300;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 12px;
            background: linear-gradient(
                110deg,
                #52525b 0%,
                #52525b 38%,
                #d4d4d8 46%,
                #ffffff 50%,
                #d4d4d8 54%,
                #52525b 62%,
                #52525b 100%
            );
            background-size: 300% 100%;
            background-position: 140% 50%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            animation: silverShimmerSweep 9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            animation-delay: 0.14s;
        }

        @keyframes silverShimmerSweep {
            0%, 80% {
                background-position: 140% 50%;
                filter: drop-shadow(0 0 0px rgba(255, 255, 255, 0));
            }
            88% {
                filter: drop-shadow(0 0 7px rgba(255, 255, 255, 0.32));
            }
            96%, 100% {
                background-position: -60% 50%;
                filter: drop-shadow(0 0 0px rgba(255, 255, 255, 0));
            }
        }

        .modal-content::-webkit-scrollbar { width: 4px; }
        .modal-content::-webkit-scrollbar-track { 
            background: transparent; 
            margin-top: 14px;
            margin-bottom: 14px;
        }
        .modal-content::-webkit-scrollbar-thumb { 
            background: rgba(255,255,255,0.12); 
            border-radius: 10px; 
        }
        .modal-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.22); }

        /* Responsive Mobile View: Dynamic Live-Synced Zoom-Out Above Modal */
        @media (max-width: 768px) {
            /* در موبایل: معماری پرداختن در گوشه راست و MANIFEST در گوشه چپ همان لایه */
            .brand-logo {
                bottom: 16px;
                left: 20px;
                right: 20px;
                justify-content: space-between;
                font-size: 11.5px;
            }
            .brand-dot {
                display: none;
            }
            .brand-manifest {
                font-size: 10.5px;
                letter-spacing: 3.5px;
            }

            /* شفاف نگه داشتن بالای صفحه در موبایل برای دید کامل به گراف زوم‌اوت شده */
            #edge-modal {
                padding: 0;
                align-items: flex-end;
                background: linear-gradient(to bottom, rgba(9, 9, 11, 0) 0%, rgba(9, 9, 11, 0.04) 28%, rgba(9, 9, 11, 0.82) 55%);
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
            .modal-layout {
                flex-direction: column;
                justify-content: flex-end;
                max-width: 100%;
                transform: translate3d(0, 100%, 0);
                transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
            }
            #edge-modal.show .modal-layout {
                transform: translate3d(0, 0, 0);
            }
            .side-node, .connecting-line {
                display: none;
            }
            .mobile-edge-graphic {
                display: flex;
            }
            .sheet-handle-area {
                display: block;
            }
            .modal-content {
                max-width: 100%;
                width: 100%;
                /* ارتفاع بیشتر برای پنجره در موبایل تا هم بلندتر و خواناتر باشد و هم آیتم‌ها فضای کافی داشته باشند */
                max-height: 72dvh;
                border-radius: 24px 24px 0 0;
                border-bottom: none !important;
                border-left: none !important;
                border-right: none !important;
                /* پدینگ متناسب با افزایش فاصله پایین‌ترین برگه از لبه اسکرین */
                padding: 10px 20px max(34px, env(safe-area-inset-bottom, 24px)) 20px;
                background: rgba(20, 20, 24, 0.95);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                overscroll-behavior-y: contain;
            }
            .modal-content::-webkit-scrollbar-track {
                margin-top: 24px;
                margin-bottom: 24px;
            }
            .accordion-header {
                padding: 14px 16px;
                font-size: 13.5px;
            }
            .accordion-body {
                padding: 0 16px;
                font-size: 13px;
                line-height: 2.1;
            }
            .accordion-item.active .accordion-body {
                padding: 0 16px 16px 16px;
            }
        }
    </style>

    <script type="text/javascript">
        // تنظیم داینامیک URL کامل تصویر تامبنیل برای شبکه‌های اجتماعی
        (function setAbsoluteOgImage() {
            try {
                var fullImgUrl = new URL('./preview.png', window.location.href).href;
                var ogImg = document.querySelector('meta[property="og:image"]');

        })();

        const essayChunks = [
            { title: "فراخوانی وضعیت", text: "معماری در هر اراده‌ورزی برای فراخوانی یک وضعیت حضور دارد. و نقش معمار از صرفاً ساختن، به «تألیفِ فرایند» گسترش می‌یابد." },
            { title: "تألیفِ فرایند", text: "این تألیف، یک آفرینش آگاهانه است که شباهت بسیاری به کدنویسی دارد، اما از صفر؛ جایی که هیچ زبانِ پیش‌فرض یا سبک آماده‌ای وجود ندارد. معمار با تکیه بر دانشی پویا و تلاش فکری منحصربه‌فرد، دیگر راه‌حل را از انباشت حافظه‌ی خود یا سبک‌های آماده فراخوانی نمی‌کند." },
            { title: "واقعیت پویا", text: "اگر واقعیتی که با آن کار می‌کنیم، پویاست، دیگر دیوارهای محیط مصنوع، عناصری منفعل نیستند. همان‌طور که در استعاره‌ی بازی «پک‌من»، ویژگی‌ها و نسبت‌های دیوارها در تعیین وضعیت جاری مؤثرند، در تولیدِ واقعیت نیز سهم دارند." },
            { title: "معماریِ پرداختن", text: "بر این بستر، معماریِ پرداختن، یک تنظیم موقعیت و زاویه‌ی نگاه، برای جستجو در ریشه‌هاست. وقتی با مسأله به عنوان محصولِ موضوعی مهم‌تر مواجهه کنیم، اطلاعاتی بنیادین دریافت می‌کنیم." },
            { title: "کنش بکر در طبیعت", text: "معماری یک کنش بکر و بنیادین در بدنه‌ی طبیعت است؛ نه یک واکنش. ما می‌پردازیم (متد) تا وضعیت‌های مطلوب را فراخوانی کنیم (هدف)." },
            { title: "مهندسیِ مواجهه و تمرکز", text: "در این متد، «تمرکز» گران‌بهاترین سرمایه‌ی مستقیم انسان در فرایند معماری است. زیرا نحوه‌ی پرداختن ما، تاثیر قدرتمندتری از خود پدیده در درک واقعیت دارد." },
            { title: "هندسه‌ی معرفتی", text: "هندسه‌ی معرفتی ما هرگز خودِ پدیده‌ی واقعیت را به طور مطلق درک نمی‌کند، بلکه همواره روایتی ثانویه از آن می‌سازد. در معماری هم «زاویه دید مؤلف» بخشی از واقعیت اثر است." },
            { title: "پردازش طیفی", text: "از آن‌جا که واقعیت بیرونی پویاست، ابزار درونی ما نیز می‌تواند طیفی و غیرخطی باشد. ذهن معمار در این مرحله یک آزمایشگاه است که منطقِ پردازش در آن، نه صفر و یک، بلکه کار با طیف‌ها (Gradients) است." },
            { title: "ایده به مثابه وضعیت", text: "در این سازه‌ی فکری، ایده دیگر یک شکل نیست؛ بلکه یک وضعیت هندسی از روابط میان پدیده‌هاست. «وضعیت»، یک پدیده‌ی صلب نیست؛ یک هارمونی از نیروهاست که معمار آن را رهبری می‌کند." },
            { title: "هوشیاری شناسنده", text: "در پردازش فاصله‌ها و نسبت‌های فعال در شبکه‌ی پیچیده‌ی واقعیت، هوشیاریِ شناسنده حیاتی است. اگر داوطلبانه برای هر پدیده مراسم نام‌گذاری برگزار نکنیم، ذهنِ الگویاب مفاهیم را با برچسب‌های عاریتی وارد طراحی می‌کند." },
            { title: "ادبیات پیش از زبان", text: "زبان‌های قراردادی تقلیل‌گرند؛ درحالی که معماری باید یک پل ادراکی مستقیم باشد. در پردازشِ بکر، از چارچوب زبانی رها می‌شویم و نرم‌افزار ادبیات را بی‌واسطه بر سخت‌افزار فضا اجرا می‌کنیم." },
